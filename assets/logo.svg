<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="aegis-logo-title">
  <title id="aegis-logo-title">Aegis</title>
  <!-- Shield: inherits currentColor, so it works on any background. -->
  <path d="M32 5 L55 13 V32 C55 45.5 45 55.5 32 59.5 C19 55.5 9 45.5 9 32 V13 Z"
        fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
  <!-- The recovery curve: degraded plateau, drop, restored plateau. -->
  <path d="M18 25 H27 L35 42 H46"
        fill="none" stroke="#14B8A6" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
