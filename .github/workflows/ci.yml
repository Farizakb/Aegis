name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-and-tier1-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only torch first so sentence-transformers cannot pull CUDA wheels
      # (mirrors sandbox/Dockerfile — keeps the install ~10x smaller/faster)
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .[dev]

      - name: Canonical test suite (no docker, no live Postgres)
        run: >
          python -m pytest tests/ -m "not docker"
          --ignore=tests/test_mcp_retrieval_server.py
          --ignore=tests/test_retrieval_search.py -q

      - name: Tier-1 policy evals — unsafe-blocked must be 100%
        run: python evals/run_evals.py --tier 1 --out-dir /tmp/eval-results
