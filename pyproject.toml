[project]
name = "aegis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "pydantic>=2.6",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "docker>=7.1",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.21",
    "pyyaml>=6.0",
]
eval = [
    "deepeval>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires fakeredis end-to-end wiring",
    "docker: requires a running Docker daemon (slow container tests)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mock_app", "mock_app.faults", "stream", "agent", "agent.nodes", "retrieval", "tools", "policy", "sandbox", "apply", "hitl", "evals", "observability", "dashboard"]
